# No normal lab node has 100,000 CPU cores.
apiVersion: v1
kind: Pod
metadata:
  name: failure-impossible-cpu
  namespace: gpu-scheduling
spec:
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
      resources:
        requests:
          cpu: "100000"
          memory: 16Mi
        limits:
          cpu: "100000"
          memory: 32Mi
