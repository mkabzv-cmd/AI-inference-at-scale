apiVersion: v1
kind: Pod
metadata:
  name: {{ include "lesson-service.fullname" . }}-test
  labels:
    {{- include "lesson-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      args:
        - --fail
        - --silent
        - --show-error
        - http://{{ include "lesson-service.fullname" . }}:{{ .Values.service.port }}/health/ready
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
