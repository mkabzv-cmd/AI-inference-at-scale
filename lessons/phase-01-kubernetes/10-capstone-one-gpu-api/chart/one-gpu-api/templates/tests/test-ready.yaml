apiVersion: v1
kind: Pod
metadata:
  name: {{ include "one-gpu-api.fullname" . }}-test
  labels:
    {{- include "one-gpu-api.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: {{ include "one-gpu-api.testImage" . | quote }}
      imagePullPolicy: {{ .Values.test.image.pullPolicy }}
      args:
        - --fail
        - --silent
        - --show-error
        - http://{{ include "one-gpu-api.fullname" . }}:{{ .Values.service.port }}/v1/models
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
