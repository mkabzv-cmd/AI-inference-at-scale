apiVersion: v1
kind: Namespace
metadata:
  name: oms-fixture
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-server
  namespace: oms-fixture
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-server
  namespace: oms-fixture
  labels:
    app.kubernetes.io/name: model-server
    oms.release/id: oms-fixture-1
  annotations:
    oms.open-model.systems/serving-topology: one-gpu
    oms.open-model.systems/worker-count: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: model-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-server
        oms.release/id: oms-fixture-1
    spec:
      serviceAccountName: model-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: example.invalid/oms-fixture@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          imagePullPolicy: IfNotPresent
          args:
            - --model
            - fixture/tiny-open-model
            - --revision
            - "1111111111111111111111111111111111111111"
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: runtime
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: model-server
  namespace: oms-fixture
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: model-server
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: oms-fixture
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-authenticated-gateway
  namespace: oms-fixture
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: model-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              oms.network/role: authenticated-gateway
          podSelector:
            matchLabels:
              oms.network/role: authenticated-gateway
      ports:
        - protocol: TCP
          port: 8000
