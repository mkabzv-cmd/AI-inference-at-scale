apiVersion: v1
kind: Pod
metadata:
  name: nvidia-smi
  namespace: gpu-scheduling
  labels:
    app.kubernetes.io/name: nvidia-smi
spec:
  restartPolicy: Never
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule
  containers:
    - name: nvidia-smi
      image: nvidia/cuda:12.4.1-base-ubuntu22.04@sha256:0f6bfcbf267e65123bcc2287e2153dedfc0f24772fb5ce84afe16ac4b2fada95
      command:
        - /bin/sh
        - -c
        - >-
          nvidia-smi
          --query-gpu=name,memory.total,driver_version
          --format=csv,noheader
      resources:
        requests:
          nvidia.com/gpu: 1
        limits:
          nvidia.com/gpu: 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
