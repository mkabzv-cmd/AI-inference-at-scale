apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lesson-service.fullname" . }}
  labels:
    {{- include "lesson-service.labels" . | nindent 4 }}
data:
  APP_MESSAGE: {{ .Values.app.message | quote }}
  APP_VERSION: {{ .Values.app.version | quote }}
  FAULT_MODE: {{ .Values.app.faultMode | quote }}
  READY_DELAY_SECONDS: {{ .Values.app.readyDelaySeconds | quote }}
