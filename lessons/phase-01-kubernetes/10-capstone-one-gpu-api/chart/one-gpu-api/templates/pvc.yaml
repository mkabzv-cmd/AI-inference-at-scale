{{- if and .Values.cache.persistence.enabled (not .Values.cache.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "one-gpu-api.fullname" . }}
  labels:
    {{- include "one-gpu-api.labels" . | nindent 4 }}
  {{- if .Values.cache.persistence.keepOnDelete }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.cache.persistence.accessModes | nindent 4 }}
  {{- with .Values.cache.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.cache.persistence.size }}
{{- end }}
