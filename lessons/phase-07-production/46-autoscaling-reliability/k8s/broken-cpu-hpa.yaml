apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oms-model-broken-cpu-signal
  namespace: oms-lesson-46
spec:
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oms-model
