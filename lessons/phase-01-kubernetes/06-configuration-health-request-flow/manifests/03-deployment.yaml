apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-app
  namespace: llm-health
  labels:
    app.kubernetes.io/name: health-app
    app.kubernetes.io/part-of: open-model-systems-course
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: health-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: health-app
        app.kubernetes.io/component: server
        app.kubernetes.io/version: 0.1.0
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: lesson06/health-app:0.1.0
          imagePullPolicy: Never
          env:
            - name: APP_GREETING
              valueFrom:
                configMapKeyRef:
                  name: health-app-config
                  key: APP_GREETING
            - name: MODEL_NAME
              valueFrom:
                configMapKeyRef:
                  name: health-app-config
                  key: MODEL_NAME
            - name: STARTUP_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: health-app-config
                  key: STARTUP_SECONDS
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 2
          volumeMounts:
            - name: configuration
              mountPath: /etc/lesson/config
              readOnly: true
            - name: api-token
              mountPath: /var/run/secrets/lesson
              readOnly: true
            - name: runtime
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: configuration
          configMap:
            name: health-app-config
        - name: api-token
          secret:
            secretName: health-app-secret
            items:
              - key: api-token
                path: api-token
        - name: runtime
          emptyDir:
            sizeLimit: 16Mi
