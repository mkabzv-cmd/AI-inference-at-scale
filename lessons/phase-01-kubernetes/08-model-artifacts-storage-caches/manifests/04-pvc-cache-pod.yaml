apiVersion: v1
kind: Pod
metadata:
  name: model-cache-pvc
  namespace: model-storage-lab
  labels:
    app.kubernetes.io/name: model-cache-inspector
    lesson.open-model-course/id: "08"
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: populate-cache
      image: REPLACE_DOWNLOADER_IMAGE
      imagePullPolicy: IfNotPresent
      env:
        - name: MODEL_ID
          value: Qwen/Qwen2.5-0.5B-Instruct
        - name: MODEL_REVISION
          value: 7ae557604adf67be50417f59c2c2f167def9a775
        - name: MODEL_TARGET
          value: /models/snapshot
        - name: HF_HOME
          value: /models/.hf-home
      volumeMounts:
        - name: models
          mountPath: /models
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  containers:
    - name: inspector
      image: busybox:1.36.1
      command: ["sh", "-c", "echo cache-ready; sleep 3600"]
      volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: model-cache
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi
