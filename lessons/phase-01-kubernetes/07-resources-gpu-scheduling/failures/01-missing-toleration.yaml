# This Pod requires the simulated GPU node but cannot tolerate its NoSchedule taint.
apiVersion: v1
kind: Pod
metadata:
  name: failure-missing-toleration
  namespace: gpu-scheduling
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: lesson.open-model-systems/accelerator
                operator: In
                values:
                  - simulated-gpu
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 20m
          memory: 32Mi
