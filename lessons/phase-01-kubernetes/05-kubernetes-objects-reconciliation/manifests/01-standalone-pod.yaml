apiVersion: v1
kind: Pod
metadata:
  name: standalone-web
  namespace: llm-systems
  labels:
    app.kubernetes.io/name: standalone-web
    app.kubernetes.io/component: web
    app.kubernetes.io/managed-by: learner
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: web
      image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
      imagePullPolicy: IfNotPresent
      args:
        - netexec
        - --http-port=8080
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
