# The name follows extended-resource syntax, but no device plugin advertises it.
apiVersion: v1
kind: Pod
metadata:
  name: failure-unadvertised-device
  namespace: gpu-scheduling
spec:
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
      resources:
        limits:
          example.com/fake-gpu: 1
