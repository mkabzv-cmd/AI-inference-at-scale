apiVersion: v1
kind: Pod
metadata:
  name: model-gpu-load
  namespace: model-storage-lab
  labels:
    app.kubernetes.io/name: model-gpu-load
    lesson.open-model-course/id: "08"
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    runAsNonRoot: true
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: populate-cache
      image: REPLACE_DOWNLOADER_IMAGE
      imagePullPolicy: IfNotPresent
      env:
        - name: MODEL_ID
          value: Qwen/Qwen2.5-0.5B-Instruct
        - name: MODEL_REVISION
          value: 7ae557604adf67be50417f59c2c2f167def9a775
        - name: MODEL_TARGET
          value: /models/snapshot
        - name: HF_HOME
          value: /models/.hf-home
      volumeMounts:
        - name: models
          mountPath: /models
        - name: tmp
          mountPath: /tmp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 250m
          memory: 256Mi
        limits:
          cpu: "2"
          memory: 2Gi
  containers:
    - name: load-model
      image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime@sha256:c8268a92a69bd500f8be0e665b2630ee006dadaf7bfbc24249141b15ff622755
      env:
        - name: HOME
          value: /tmp
        - name: PIP_DISABLE_PIP_VERSION_CHECK
          value: "1"
      command:
        - bash
        - -ceu
        - |
          python -m venv --system-site-packages /tmp/lesson-venv
          /tmp/lesson-venv/bin/pip install --no-cache-dir \
            transformers==4.48.1 safetensors==0.5.2
          /tmp/lesson-venv/bin/python - <<'PY'
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer

          path = "/models/snapshot"
          print(f"cuda_available={torch.cuda.is_available()}", flush=True)
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is not available inside the Pod")
          print(f"device={torch.cuda.get_device_name(0)}", flush=True)
          tokenizer = AutoTokenizer.from_pretrained(path, local_files_only=True)
          model = AutoModelForCausalLM.from_pretrained(
              path,
              torch_dtype=torch.float16,
              local_files_only=True,
          ).to("cuda").eval()
          prompt = tokenizer.apply_chat_template(
              [{"role": "user", "content": "Reply with exactly: cache works"}],
              tokenize=False,
              add_generation_prompt=True,
          )
          inputs = tokenizer(prompt, return_tensors="pt").to("cuda")
          with torch.inference_mode():
              output = model.generate(**inputs, max_new_tokens=12, do_sample=False)
          reply = tokenizer.decode(
              output[0, inputs.input_ids.shape[1]:],
              skip_special_tokens=True,
          )
          print(f"model_device={next(model.parameters()).device}", flush=True)
          print(
              f"allocated_mib={torch.cuda.memory_allocated() / 1024**2:.1f}",
              flush=True,
          )
          print(f"reply={reply!r}", flush=True)
          PY
          sleep 600
      volumeMounts:
        - name: models
          mountPath: /models
          readOnly: true
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: "1"
          memory: 4Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 8Gi
          nvidia.com/gpu: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  volumes:
    - name: models
      persistentVolumeClaim:
        claimName: model-cache
    - name: tmp
      emptyDir:
        sizeLimit: 2Gi
